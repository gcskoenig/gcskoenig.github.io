<style>

@font-face{
  font-family:"Archivo";font-style:normal;font-weight:400 700;font-display:swap;
  src:url(/fonts/archivo-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face{
  font-family:"Archivo";font-style:normal;font-weight:400 700;font-display:swap;
  src:url(/fonts/archivo-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:#FFFFFF;color:#0A0A0A;
  font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  line-height:1.55;-webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
ol,ul{list-style:none;margin:0;padding:0}
h1,h2,p{margin:0}

.col{max-width:720px;margin:0 auto;padding:88px 32px 104px}

.byline{display:flex;align-items:center;gap:20px}
.avatar{
  width:84px;height:84px;flex:0 0 84px;border-radius:50%;
  object-fit:cover;object-position:50% 12%;display:block;background:#E8E8E8;
}
.name{font-size:31px;font-weight:700;letter-spacing:-.026em;line-height:1.1}
.role{font-size:14.5px;color:#767676;margin-top:5px}

.bio{margin-top:34px}
.bio p{font-size:17.5px;line-height:1.7;color:#333333}
.bio p + p{margin-top:20px}
.bio em{font-style:normal;font-weight:500;color:#0A0A0A}
.bio a{color:#1A4FD6;font-weight:500}
.bio a:hover{text-decoration:underline}

.back{display:inline-block;font-size:14.5px;color:#767676;margin-bottom:26px}
.back:hover{color:#1A4FD6;text-decoration:underline}
.bio h2{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#767676;margin:48px 0 18px;padding-bottom:11px;border-bottom:1px solid #E5E5E5}
.bio strong{font-weight:600;color:#0A0A0A}

.links{display:flex;flex-wrap:wrap;gap:20px;margin-top:26px;font-size:15px}
.links a{color:#1A4FD6;font-weight:500}
.links a:hover{text-decoration:underline}

.sechead{margin-top:64px;padding-bottom:11px;border-bottom:1px solid #E5E5E5}
.sechead h2{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#767676}

.pubs li{display:grid;grid-template-columns:54px 1fr;gap:22px;padding:22px 0;border-bottom:1px solid #EFEFEF}
.yr{font-size:13.5px;color:#A8A8A8;padding-top:3px;font-weight:500;font-variant-numeric:tabular-nums}
.t{font-size:18px;font-weight:600;line-height:1.36;letter-spacing:-.012em;margin-bottom:6px}
.t a:hover{color:#1A4FD6;text-decoration:underline}
.a{font-size:14px;color:#767676;line-height:1.5}
.a strong{color:#0A0A0A;font-weight:600}
.meta{margin-top:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.venue{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#1A4FD6}
.note{font-size:13px;color:#A8A8A8}
.pdf{font-size:13.5px;color:#1A4FD6;font-weight:500}
.pdf:hover{text-decoration:underline}

.foot{margin-top:48px;font-size:13.5px;color:#A8A8A8}
.foot a{color:#767676}
.foot a:hover{color:#1A4FD6;text-decoration:underline}

a:focus-visible,.avatar:focus-visible{outline:2px solid #1A4FD6;outline-offset:3px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){
  .col{padding:56px 22px 76px}
  .avatar{width:68px;height:68px;flex:0 0 68px}
  .name{font-size:27px}
  .bio p{font-size:16.5px}
  .pubs li{grid-template-columns:1fr;gap:4px}
}
