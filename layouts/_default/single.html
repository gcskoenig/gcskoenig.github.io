<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Title }} · {{ .Site.Title }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' font-family='system-ui'>GK</text></svg>">
{{ partial "styles.html" . }}
</head>
<body>
<main class="col">

  <a class="back" href="/">{{ .Site.Title }}</a>
  <h1 class="name">{{ .Title }}</h1>

  <div class="bio">{{ .Content }}</div>

  {{ partial "footer.html" . }}

</main>
</body>
</html>
